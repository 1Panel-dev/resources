name: Publish scripts to OSS
run-name: 发布 脚本 到 ${{ inputs.oss_directory }}

"on":
  workflow_dispatch:
    inputs:
      oss_directory:
        description: OSS destination directory (must end with /)
        required: true
        type: string
        default: oss://resource-fit2cloud-com/1panel/resource/v2/script_tmp/

permissions:
  contents: read

concurrency:
  group: publish-scripts-oss
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Publish scripts
        uses: ./.github/actions/publish-resource
        with:
          resource: scripts
          oss-directory: ${{ inputs.oss_directory }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
