recipes:
  - key: run-qwen3.6-35b-a3b-nvfp4-on-1-gb10
    sort: 10
    name: "Qwen3.6-35B-A3B-NVFP4"
    imageType: nvidia
    model: "Qwen/Qwen3.6-35B-A3B-NVFP4"
    description:
      en: "Qwen3.6-35B-A3B-NVFP4 MoE model with 35B total and 3B active parameters on a single GB10"
      es-es: "Modelo MoE Qwen3.6-35B-A3B-NVFP4 con 35B parámetros totales y 3B activos en una única GB10"
      ja: "35B 総パラメータ・3B アクティブの MoE モデル Qwen3.6-35B-A3B-NVFP4 を単一の GB10 で実行"
      ko: "35B 전체 · 3B 활성 파라미터의 MoE 모델 Qwen3.6-35B-A3B-NVFP4를 단일 GB10에서 실행"
      ms: "Model MoE Qwen3.6-35B-A3B-NVFP4 dengan 35B parameter keseluruhan dan 3B aktif pada satu GB10"
      pt-br: "Modelo MoE Qwen3.6-35B-A3B-NVFP4 com 35B parâmetros totais e 3B ativos em uma única GB10"
      ru: "MoE-модель Qwen3.6-35B-A3B-NVFP4 с 35B общих и 3B активных параметров на одном GB10"
      tr: "35B toplam ve 3B aktif parametreli MoE modeli Qwen3.6-35B-A3B-NVFP4'yi tek bir GB10 üzerinde çalıştır"
      zh-hant: "在單張 GB10 上執行 Qwen3.6-35B-A3B-NVFP4 MoE 模型（35B 總參數、3B 啟動參數）"
      zh: "在单张 GB10 上运行 Qwen3.6-35B-A3B-NVFP4 MoE 模型（35B 总参数、3B 激活参数）"
  - key: run-qwen3.8-flash-next-nvfp4-on-2-rtx-pro-5000-72g
    sort: 20
    name: "Qwen3.8-Flash-Next-NVFP4"
    imageType: nvidia
    model: "nvidia/Qwen3.8-Flash-Next-NVFP4"
    description:
      en: "Qwen3.8-Flash-Next-NVFP4 MoE model with 125B total and 6B active parameters on two RTX PRO 5000 72G GPUs"
      es-es: "Modelo MoE Qwen3.8-Flash-Next-NVFP4 con 125B parámetros totales y 6B activos en dos GPU RTX PRO 5000 de 72G"
      ja: "125B 総パラメータ・6B アクティブの MoE モデル Qwen3.8-Flash-Next-NVFP4 を 2 基の RTX PRO 5000 72G で実行"
      ko: "125B 전체 · 6B 활성 파라미터의 MoE 모델 Qwen3.8-Flash-Next-NVFP4를 RTX PRO 5000 72G 2장에서 실행"
      ms: "Model MoE Qwen3.8-Flash-Next-NVFP4 dengan 125B parameter keseluruhan dan 6B aktif pada dua RTX PRO 5000 72G"
      pt-br: "Modelo MoE Qwen3.8-Flash-Next-NVFP4 com 125B parâmetros totais e 6B ativos em duas RTX PRO 5000 de 72G"
      ru: "MoE-модель Qwen3.8-Flash-Next-NVFP4 с 125B общих и 6B активных параметров на двух RTX PRO 5000 72G"
      tr: "125B toplam ve 6B aktif parametreli MoE modeli Qwen3.8-Flash-Next-NVFP4'yi iki adet RTX PRO 5000 72G üzerinde çalıştır"
      zh-hant: "在兩張 RTX PRO 5000 72G 上執行 Qwen3.8-Flash-Next-NVFP4 MoE 模型（125B 總參數、6B 啟動參數）"
      zh: "在两张 RTX PRO 5000 72G 上运行 Qwen3.8-Flash-Next-NVFP4 MoE 模型（125B 总参数、6B 激活参数）"
  - key: run-deepseek-v4.1-flash-1017-512k-on-8-rtx-pro-5000-72g
    sort: 30
    name: "DeepSeek-V4.1-Flash-1017 (8 GPUs, 512K)"
    imageType: nvidia
    model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    description:
      en: "Run DeepSeek-V4.1-Flash-1017 in official FP4+FP8 mixed precision on eight RTX PRO 5000 72G GPUs with 512K context, no Engram CPU offload and no speculative decoding"
      es-es: "Ejecuta DeepSeek-V4.1-Flash-1017 con precisión mixta FP4+FP8 oficial en ocho GPU RTX PRO 5000 de 72G, contexto de 512K, sin descarga de Engram a CPU ni decodificación especulativa"
      ja: "8 基の RTX PRO 5000 72G で公式 FP4+FP8 混合精度の DeepSeek-V4.1-Flash-1017 を実行。512K コンテキスト、Engram の CPU オフロードなし、投機的デコーディングなし"
      ko: "RTX PRO 5000 72G 8장에서 공식 FP4+FP8 혼합 정밀도 DeepSeek-V4.1-Flash-1017 실행. 512K 컨텍스트, Engram CPU 오프로딩 및 추측 디코딩 비활성화"
      ms: "Jalankan DeepSeek-V4.1-Flash-1017 dalam ketepatan campuran FP4+FP8 rasmi pada lapan RTX PRO 5000 72G dengan konteks 512K, tanpa pemindahan Engram ke CPU atau penyahkodan spekulatif"
      pt-br: "Execute DeepSeek-V4.1-Flash-1017 com precisão mista FP4+FP8 oficial em oito RTX PRO 5000 de 72G, contexto de 512K, sem descarregamento de Engram para CPU nem decodificação especulativa"
      ru: "Запуск DeepSeek-V4.1-Flash-1017 с официальной смешанной точностью FP4+FP8 на восьми RTX PRO 5000 72G: контекст 512K, без выгрузки Engram в CPU и спекулятивного декодирования"
      tr: "DeepSeek-V4.1-Flash-1017'yi sekiz adet RTX PRO 5000 72G üzerinde resmi FP4+FP8 karma hassasiyet ve 512K bağlam ile, Engram CPU aktarımı ve spekülatif kod çözme olmadan çalıştır"
      zh-hant: "在八張 RTX PRO 5000 72G 上以官方 FP4+FP8 混合精度執行 DeepSeek-V4.1-Flash-1017，512K 上下文，Engram 不卸載至 CPU，不啟用投機解碼"
      zh: "在八张 RTX PRO 5000 72G 上以官方 FP4+FP8 混合精度运行 DeepSeek-V4.1-Flash-1017，512K 上下文，Engram 不卸载至 CPU，不开启投机解码"
  - key: run-deepseek-v4.1-flash-1017-1m-dspark-on-8-rtx-pro-5000-72g
    sort: 40
    name: "DeepSeek-V4.1-Flash-1017 (8 GPUs, 1M DSpark)"
    imageType: nvidia
    model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    description:
      en: "Run DeepSeek-V4.1-Flash-1017 in official FP4+FP8 mixed precision on eight RTX PRO 5000 72G GPUs with 1M context, Engram CPU offload and DSpark speculative decoding"
      es-es: "Ejecuta DeepSeek-V4.1-Flash-1017 con precisión mixta FP4+FP8 oficial en ocho GPU RTX PRO 5000 de 72G, contexto de 1M, descarga de Engram a CPU y decodificación especulativa DSpark"
      ja: "8 基の RTX PRO 5000 72G で公式 FP4+FP8 混合精度の DeepSeek-V4.1-Flash-1017 を実行。1M コンテキスト、Engram の CPU オフロードと DSpark 投機的デコーディングを有効化"
      ko: "RTX PRO 5000 72G 8장에서 공식 FP4+FP8 혼합 정밀도 DeepSeek-V4.1-Flash-1017 실행. 1M 컨텍스트, Engram CPU 오프로딩 및 DSpark 추측 디코딩 활성화"
      ms: "Jalankan DeepSeek-V4.1-Flash-1017 dalam ketepatan campuran FP4+FP8 rasmi pada lapan RTX PRO 5000 72G dengan konteks 1M, pemindahan Engram ke CPU dan penyahkodan spekulatif DSpark"
      pt-br: "Execute DeepSeek-V4.1-Flash-1017 com precisão mista FP4+FP8 oficial em oito RTX PRO 5000 de 72G, contexto de 1M, descarregamento de Engram para CPU e decodificação especulativa DSpark"
      ru: "Запуск DeepSeek-V4.1-Flash-1017 с официальной смешанной точностью FP4+FP8 на восьми RTX PRO 5000 72G: контекст 1M, выгрузка Engram в CPU и спекулятивное декодирование DSpark"
      tr: "DeepSeek-V4.1-Flash-1017'yi sekiz adet RTX PRO 5000 72G üzerinde resmi FP4+FP8 karma hassasiyet, 1M bağlam, Engram CPU aktarımı ve DSpark spekülatif kod çözme ile çalıştır"
      zh-hant: "在八張 RTX PRO 5000 72G 上以官方 FP4+FP8 混合精度執行 DeepSeek-V4.1-Flash-1017，1M 上下文，啟用 Engram CPU 卸載及 DSpark 投機解碼"
      zh: "在八张 RTX PRO 5000 72G 上以官方 FP4+FP8 混合精度运行 DeepSeek-V4.1-Flash-1017，1M 上下文，启用 Engram CPU 卸载及 DSpark 投机解码"
  - key: run-qwen3.8-27b-fp8-on-1-rtx-pro-5000-72g
    sort: 50
    name: "Qwen3.8-27B-FP8 (GPU0)"
    imageType: nvidia
    model: "Qwen/Qwen3.8-27B-FP8"
    description:
      en: "Qwen3.8-27B-FP8 dense model with 27B parameters on GPU 0 of a dual RTX PRO 5000 72G host"
      es-es: "Modelo denso Qwen3.8-27B-FP8 con 27B parámetros en la GPU 0 de un equipo con dos RTX PRO 5000 de 72G"
      ja: "27B パラメータの Dense モデル Qwen3.8-27B-FP8 を、RTX PRO 5000 72G を 2 基搭載したマシンの GPU 0 で実行"
      ko: "27B 파라미터의 Dense 모델 Qwen3.8-27B-FP8를 RTX PRO 5000 72G 2장 구성에서 GPU 0에서 실행"
      ms: "Model padat Qwen3.8-27B-FP8 dengan 27B parameter pada GPU 0 dalam hos dua RTX PRO 5000 72G"
      pt-br: "Modelo denso Qwen3.8-27B-FP8 com 27B parâmetros na GPU 0 de um host com duas RTX PRO 5000 de 72G"
      ru: "Плотная модель Qwen3.8-27B-FP8 с 27B параметров на GPU 0 в конфигурации с двумя RTX PRO 5000 72G"
      tr: "27B parametreli yoğun model Qwen3.8-27B-FP8'yi iki RTX PRO 5000 72G bulunan sistemde GPU 0 üzerinde çalıştır"
      zh-hant: "在雙 RTX PRO 5000 72G 主機的 GPU 0 上執行 Qwen3.8-27B-FP8 稠密模型（27B 參數）"
      zh: "在双 RTX PRO 5000 72G 主机的 GPU 0 上运行 Qwen3.8-27B-FP8 稠密模型（27B 参数）"
