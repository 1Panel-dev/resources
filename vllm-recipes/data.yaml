recipes:
  - key: run-qwen3.6-35b-a3b-on-1-gb10
    sort: 10
    name: "Qwen3.6-35B-A3B"
    imageType: nvidia
    model: "Qwen/Qwen3.6-35B-A3B"
    description:
      en: "Qwen3.6-35B-A3B MoE model with 35B total and 3B active parameters on a single GB10"
      es-es: "Modelo MoE Qwen3.6-35B-A3B con 35B parámetros totales y 3B activos en una única GB10"
      ja: "35B 総パラメータ・3B アクティブの MoE モデル Qwen3.6-35B-A3B を単一の GB10 で実行"
      ko: "35B 전체 · 3B 활성 파라미터의 MoE 모델 Qwen3.6-35B-A3B를 단일 GB10에서 실행"
      ms: "Model MoE Qwen3.6-35B-A3B dengan 35B parameter keseluruhan dan 3B aktif pada satu GB10"
      pt-br: "Modelo MoE Qwen3.6-35B-A3B com 35B parâmetros totais e 3B ativos em uma única GB10"
      ru: "MoE-модель Qwen3.6-35B-A3B с 35B общих и 3B активных параметров на одном GB10"
