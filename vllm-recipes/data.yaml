      ms: "Model MoE Qwen3.6-35B-A3B-FP8 dengan 35B parameter keseluruhan dan 3B aktif pada GPU 1 dalam hos dua RTX PRO 5000 72G"
      pt-br: "Modelo MoE Qwen3.6-35B-A3B-FP8 com 35B parâmetros totais e 3B ativos na GPU 1 de um host com duas RTX PRO 5000 de 72G"
