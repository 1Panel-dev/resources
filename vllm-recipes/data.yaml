      es-es: "Modelo MoE Qwen3.6-35B-A3B-FP8 con 35B parámetros totales y 3B activos en la GPU 1 de un equipo con dos RTX PRO 5000 de 72G"
      ja: "35B 総パラメータ・3B アクティブの MoE モデル Qwen3.6-35B-A3B-FP8 を、RTX PRO 5000 72G を 2 基搭載したマシンの GPU 1 で実行"
